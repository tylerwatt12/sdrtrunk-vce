check.dependsOn tasks.named('verifyBundledVoiceDecryption')
check.dependsOn tasks.named('verifyBundledApplicationDatabaseMigrator')
check.dependsOn tasks.named('verifyUpdateChannelMetadata')

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

javadoc {
    options.addStringOption('-add-modules', 'jdk.incubator.vector')
    options.addStringOption('Xdoclint:none', '-quiet')
}

