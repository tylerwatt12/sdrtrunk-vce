def archiveEntryBytes = { ZipFile zip, String entryName ->
    def entry = zip.getEntry(entryName)

    if(entry == null || entry.directory) {
        throw new GradleException("Required package entry is missing: ${entryName}")
    }

    zip.getInputStream(entry).withCloseable { input -> input.readAllBytes() }
}

def archiveEntryText = { ZipFile zip, String entryName ->
    new String(archiveEntryBytes(zip, entryName), java.nio.charset.StandardCharsets.UTF_8)
}

def verifyRuntimePackage = { Map target, File archive ->
    if(!archive.isFile() || archive.length() == 0) {
        throw new GradleException("Runtime package is missing or empty: ${archive}")
    }

    String root = target.packageRoot as String

    if(archive.name != "${root}.zip") {
        throw new GradleException("Package root ${root} does not match archive ${archive.name}")
    }
    String runtimeLauncher = "${root}/bin/java${target.windows ? '.exe' : ''}"
    String applicationJar = "${root}/lib/${packagedApplicationName}-${releaseVersion}.jar"
    ZipFile zip = new ZipFile(archive)

    try {
        def entries = zip.entries().toList()
        def outsideRoot = entries.findAll { entry ->
            entry.name != "${root}/" && !entry.name.startsWith("${root}/")
        }

        if(!outsideRoot.isEmpty()) {
            throw new GradleException("Package contains entries outside ${root}: ${outsideRoot*.name}")
        }

        def vendorRootEntries = entries.findAll { entry ->
            entry.name.startsWith("${root}/${target.archiveRoot}/")
        }

        if(!vendorRootEntries.isEmpty()) {
            throw new GradleException("Package retains the vendor archive root: ${vendorRootEntries*.name}")
        }

        def emptyLegalFiles = entries.findAll { entry ->
            !entry.directory && entry.name.startsWith("${root}/legal/") && entry.size == 0
        }

        if(!emptyLegalFiles.isEmpty()) {
            throw new GradleException("Package contains empty vendor legal files: ${emptyLegalFiles*.name}")
        }

        def packagedFileNames = entries.findAll { !it.directory }*.name
        def emptyDirectories = entries.findAll { directory ->
            directory.directory && !packagedFileNames.any { it.startsWith(directory.name) }
        }

        if(!emptyDirectories.isEmpty()) {
            throw new GradleException("Package contains empty directories: ${emptyDirectories*.name}")
        }

        [
                runtimeLauncher,
                "${root}/bin/${packagedApplicationName}",
                "${root}/bin/${packagedApplicationName}.bat",
                applicationJar,
                "${root}/stats-web/index.html",
                "${root}/LICENSE",
                "${root}/RUNTIME-LICENSE",
                "${root}/NOTICE",
                "${root}/release"
        ].each { archiveEntryBytes(zip, it) }

        if(zip.getEntry("${root}/bin/javac") != null || zip.getEntry("${root}/bin/javac.exe") != null) {
            throw new GradleException("Package ${archive.name} contains a JDK instead of the smaller JRE")
        }

        String releaseText = archiveEntryText(zip, "${root}/release")

        if(!releaseText.contains('IMPLEMENTOR="BellSoft"') ||
                !releaseText.contains('JAVA_VERSION="25.0.1"') ||
                !releaseText.contains("OS_ARCH=\"${target.releaseArchitecture}\"")) {
            throw new GradleException("Package ${archive.name} has unexpected Liberica runtime metadata")
        }

        ["${root}/bin/${packagedApplicationName}", "${root}/bin/${packagedApplicationName}.bat"].each { launcherName ->
            String launcher = archiveEntryText(zip, launcherName)

            [
                    '--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED',
                    '--add-modules=jdk.incubator.vector,jdk.httpserver',
                    '--enable-native-access=ALL-UNNAMED',
                    '--enable-native-access=javafx.graphics',
                    '-Xmx2g',
                    '-XX:+UseCompactObjectHeaders'
            ].each { requiredArgument ->
                if(!launcher.contains(requiredArgument)) {
                    throw new GradleException("Launcher ${launcherName} is missing ${requiredArgument}")
                }
            }

            if(launcherName.endsWith('.bat')) {
                if(!launcher.contains('set JAVA_HOME=%APP_HOME%') ||
                        !launcher.contains('set JAVA_EXE=%JAVA_HOME%/bin/java.exe')) {
                    throw new GradleException("Launcher ${launcherName} does not use its bundled Java runtime")
                }
            }
            else if(!launcher.contains('JAVA_HOME=$APP_HOME') ||
                    !launcher.contains('JAVACMD=$JAVA_HOME/bin/java')) {
                throw new GradleException("Launcher ${launcherName} does not use its bundled Java runtime")
            }

        }

        byte[] applicationJarBytes = archiveEntryBytes(zip, applicationJar)
        new JarInputStream(new ByteArrayInputStream(applicationJarBytes)).withCloseable { applicationJarInput ->
            def manifest = applicationJarInput.manifest

            if(manifest == null ||
                    manifest.mainAttributes.getValue('Implementation-Version') != releaseVersion ||
                    manifest.mainAttributes.getValue('Update-Track') != updateTrack ||
                    manifest.mainAttributes.getValue('Update-Build') != updateBuild) {
                throw new GradleException("Application metadata does not match package ${archive.name}")
            }
        }

    }
    finally {
        zip.close()
    }
}

runtimeTargets.each { target ->
    def downloadTask = tasks.register("downloadLiberica${target.id}") {
        group = 'distribution'
        description = "Downloads the pinned BellSoft JRE for ${target.targetName}."
        inputs.property('url', target.url)
        inputs.property('size', target.size)
        inputs.property('sha256', target.sha256)
        outputs.file(target.archiveFile)
        outputs.upToDateWhen { cachedRuntimeIsValid(target) }

        doLast {
            if(cachedRuntimeIsValid(target)) {
                return
            }

            File destination = target.archiveFile as File
            destination.parentFile.mkdirs()
            File partial = new File(destination.parentFile,
                    "${destination.name}.part-${ProcessHandle.current().pid()}-${Thread.currentThread().id}")

            try {
                Files.deleteIfExists(partial.toPath())
                def connection = new URI(target.url as String).toURL().openConnection()
                connection.connectTimeout = 30_000
                connection.readTimeout = 120_000
                connection.setRequestProperty('User-Agent', 'sdrtrunk-vce Gradle packager')

                connection.getInputStream().withCloseable { input ->
                    partial.withOutputStream { output -> input.transferTo(output) }
                }

                if(partial.length() != (target.size as long) ||
                        fileDigest(partial, 'SHA-256') != target.sha256) {
                    throw new GradleException("Downloaded runtime failed size or checksum verification: ${target.url}")
                }

                try {
                    Files.move(partial.toPath(), destination.toPath(),
                            StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
                }
                catch(java.nio.file.AtomicMoveNotSupportedException ignored) {
                    Files.move(partial.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }

                logger.lifecycle("Cached ${target.archiveName} in ${runtimeCacheDirectory}")
            }
            finally {
                Files.deleteIfExists(partial.toPath())
            }
        }
    }

    target.downloadTask = downloadTask
}

runtimeTargets.findAll { !it.windows }.each { target ->
    def materializedDirectory = layout.buildDirectory.dir("generated/runtime-legal/${target.id}")
    def materializeTask = tasks.register("materializeRuntimeLegalLinks${target.id}") {
        dependsOn(target.downloadTask)
        inputs.file(target.archiveFile)
        inputs.property('archiveRoot', target.archiveRoot)
        inputs.property('legalLinkSources', legalLinkSourceByName)
        inputs.property('expectedLegalLinks', expectedMaterializedLegalLinks)
        outputs.dir(materializedDirectory)

        doLast {
            File outputDirectory = materializedDirectory.get().asFile

            if(outputDirectory.exists()) {
                Files.walk(outputDirectory.toPath()).withCloseable { paths ->
                    paths.sorted(Comparator.reverseOrder()).forEach { Files.delete(it) }
                }
            }

            Map<String, byte[]> sourceContents = [:]
            List<String> linkPaths = []

            runtimeArchiveTree(target).visit { details ->
                if(details.directory) {
                    return
                }

                String[] segments = details.relativePath.segments

                if(segments.length < 2 || segments[0] != target.archiveRoot) {
                    throw new GradleException("Unexpected top-level entry in ${target.archiveName}: ${details.path}")
                }

                String relativePath = segments.drop(1).join('/')

                if(legalLinkSourceByName.values().contains(relativePath)) {
                    sourceContents[relativePath] = Files.readAllBytes(details.file.toPath())
                }

                if(relativePath.startsWith('legal/') && details.file.length() == 0) {
                    linkPaths.add(relativePath)
                }
            }

            if(linkPaths.size() != expectedMaterializedLegalLinks) {
                throw new GradleException("Expected ${expectedMaterializedLegalLinks} vendor legal links in " +
                        "${target.archiveName}, found ${linkPaths.size()}")
            }

            linkPaths.each { linkPath ->
                String fileName = linkPath.tokenize('/').last()
                String sourcePath = legalLinkSourceByName[fileName]
                byte[] contents = sourceContents[sourcePath]

                if(sourcePath == null || contents == null || contents.length == 0) {
                    throw new GradleException("Cannot materialize vendor legal link ${linkPath} in ${target.archiveName}")
                }

                File destination = new File(outputDirectory, linkPath)
                Files.createDirectories(destination.parentFile.toPath())
                Files.write(destination.toPath(), contents)
            }
        }
    }

    target.materializedLegalDirectory = materializedDirectory
    target.materializeLegalTask = materializeTask
}

tasks.named('startScripts') { startScriptsTask ->
    doLast {
        File unixLauncher = new File(startScriptsTask.outputDir, packagedApplicationName)
        File windowsLauncher = new File(startScriptsTask.outputDir, "${packagedApplicationName}.bat")
        String unixMarker = '# Use the maximum available, or set MAX_FD != -1 to use that value.'
        String windowsMarker = '@rem Add default JVM options here.'
        String unixText = unixLauncher.getText('UTF-8')
        String windowsText = windowsLauncher.getText('UTF-8')

        if(unixText.count(unixMarker) != 1 || windowsText.count(windowsMarker) != 1) {
            throw new GradleException('Gradle launcher format changed; refusing to create a package that ignores its bundled Java runtime')
        }

        unixLauncher.setText(unixText.replace(unixMarker,
                "JAVA_HOME=\$APP_HOME\n\n${unixMarker}"), 'UTF-8')
        windowsLauncher.setText(windowsText.replace(windowsMarker,
                "set JAVA_HOME=%APP_HOME%\r\n\r\n${windowsMarker}"), 'UTF-8')
    }
}

def applicationInstallDirectory = layout.buildDirectory.dir("install/${packagedApplicationName}")
def packageTasks = []

runtimeTargets.each { target ->
    def packageTask = tasks.register("runtimeZip${target.id}", Zip) {
        description = "Packages ${target.targetName} with its complete BellSoft JRE."
        dependsOn(target.downloadTask)
        dependsOn(tasks.named('installDist'))
        dependsOn('verifyApprovedReleaseNotes')
        dependsOn('verifyBundledApplicationDatabaseMigrator')
        dependsOn('verifyUpdateChannelMetadata')

        if(!target.windows) {
            dependsOn(target.materializeLegalTask)
        }

        archiveFileName = "${packagedApplicationName}-${target.targetName}.zip"
        destinationDirectory = layout.buildDirectory.dir('image')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        includeEmptyDirs = false
        zip64 = true

        from(runtimeArchiveTree(target)) {
            into(target.packageRoot)

            eachFile { details ->
                String[] segments = details.relativePath.segments

                if(segments.length < 2 || segments[0] != target.packageRoot ||
                        segments[1] != target.archiveRoot) {
                    throw new GradleException("Unexpected top-level entry in ${target.archiveName}: ${details.path}")
                }

                if(segments.length == 2) {
                    details.exclude()
                    return
                }

                String[] strippedSegments = segments.drop(2) as String[]

                if(!target.windows && strippedSegments[0] == 'legal' && details.file.length() == 0) {
                    details.exclude()
                    return
                }

                //The package root keeps the project GPL; retain the runtime's separate license under a clear name.
                if(strippedSegments.length == 1 && strippedSegments[0] == 'LICENSE') {
                    strippedSegments = ['RUNTIME-LICENSE'] as String[]
                }

                List<String> outputSegments = [target.packageRoot.toString()] + strippedSegments.toList()
                details.relativePath = new org.gradle.api.file.RelativePath(
                        details.relativePath.isFile(), outputSegments as String[])

                if(!target.windows) {
                    String strippedPath = strippedSegments.join('/')

                    if(strippedPath.startsWith('bin/') ||
                            strippedPath == 'lib/jexec' ||
                            strippedPath == 'lib/jspawnhelper') {
                        details.permissions { unix('rwxr-xr-x') }
                    }
                }
            }
        }

        if(!target.windows) {
            from(target.materializedLegalDirectory) {
                into(target.packageRoot)
            }
        }

        from(applicationInstallDirectory) {
            into(target.packageRoot)

            eachFile { details ->
                if(details.relativePath.pathString.endsWith("/bin/${packagedApplicationName}")) {
                    details.permissions { unix('rwxr-xr-x') }
                }
            }
        }

        doLast {
            verifyRuntimePackage(target, archiveFile.get().asFile)
        }
    }

    packageTasks.add(packageTask)
}

tasks.register('runtimeZipAll') {
    group = 'distribution'
    description = 'Builds one application distribution and packages all six supported OS/CPU archives.'
    dependsOn(packageTasks)

    doLast {
        Set<String> expected = runtimeTargets.collect {
            "${packagedApplicationName}-${it.targetName}.zip"
        } as Set
        Set<String> actual = fileTree(layout.buildDirectory.dir('image')) {
            include "${packagedApplicationName}-*-v${releaseVersion}.zip"
        }.files.collect { it.name } as Set

        if(actual != expected) {
            throw new GradleException("Expected exactly six release archives. Expected ${expected}; found ${actual}")
        }

        logger.lifecycle("Created and verified all six release archives in ${layout.buildDirectory.dir('image').get()}")
    }
}
