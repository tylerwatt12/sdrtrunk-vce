tasks.register('verifyBundledApplicationDatabaseMigrator') {
    group = 'verification'
    description = 'Verifies that packaged builds contain the single application database migrator.'
    dependsOn jar
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })

    doLast {
        def archive = inputs.files.singleFile
        def helperEntries = [
            'io/github/dsheirer/database/upgrade/ApplicationDatabaseMigrator.class',
            'io/github/dsheirer/database/upgrade/DatabaseFormatCatalog.class',
            'io/github/dsheirer/database/upgrade/DatabaseMigrationChain.class',
            'io/github/dsheirer/database/upgrade/DatabaseMigrationEffect.class',
            'io/github/dsheirer/database/upgrade/DatabaseMigrationStep.class',
            'io/github/dsheirer/database/upgrade/Format1To2DatabaseMigration.class',
            'io/github/dsheirer/database/upgrade/Format2SchemaSql.class',
            'io/github/dsheirer/database/upgrade/Format2To3DatabaseMigration.class'
        ]
        def retiredEntries = [
            'io/github/dsheirer/database/upgrade/Alpha9DatabaseMigration.class',
            'io/github/dsheirer/database/upgrade/P25ActivitySchemaUpgrade.class',
            'io/github/dsheirer/database/upgrade/TrunkedSiteSchemaInstaller.class',
            'io/github/dsheirer/preference/encryption/vault/EncryptionKeyVaultMigrationTool.class'
        ]
        def zip = new java.util.zip.ZipFile(archive)

        try {
            helperEntries.each { helperEntry ->
                if(zip.getEntry(helperEntry) == null) {
                    throw new GradleException(
                        "Packaged application database migrator ${helperEntry} is missing from ${archive.name}")
                }
            }
            retiredEntries.each { retiredEntry ->
                if(zip.getEntry(retiredEntry) != null) {
                    throw new GradleException(
                        "Retired standalone migration entry point ${retiredEntry} is still present in ${archive.name}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyNoBundledVoiceDecryption') {
    dependsOn jar
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    inputs.files(configurations.runtimeClasspath)
    doLast {
        def forbiddenEntries = [
            'io/github/dsheirer/audio/codec/mbe/decrypt/Apco25AdpVoiceFrameDecryptor.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/Apco25OfbVoiceFrameDecryptor.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/Apco25VoiceFrameDecryptorProvider.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/P25VoiceKeystreamFactory.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/dmr/DmrPrivacyFrameDecryptor.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/dmr/DmrPrivacyFrameDecryptorProvider.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/crypto/AesOfb.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/crypto/DesOfb.class',
            'io/github/dsheirer/audio/codec/mbe/decrypt/crypto/Rc4.class',
            'io/github/dsheirer/voice/decrypt/module/SdrTrunkVoiceDecryptionModule.class'
        ] as Set
        def archives = inputs.files.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }

        archives.each { archive ->
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def bundled = forbiddenEntries.findAll { zip.getEntry(it) != null }
                if(!bundled.isEmpty()) {
                    throw new GradleException("Voice decryption implementation bundled in ${archive.name}: ${bundled}")
                }
            } finally {
                zip.close()
            }
        }
    }
}

