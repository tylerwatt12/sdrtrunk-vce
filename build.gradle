/**
 * Instructions for building/compiling the sdrtrunk application.
 *
 * Prerequisites:
 * Install and configure a Java 25 JDK that includes JavaFX modules (for example, BellSoft Liberica JDK Full)
 * - Optional: install and configure Gradle 8.10+
 *
 * Scenario 1: run the application via gradle command line from the source code root directory:
 * command: ./gradlew run
 *
 * Scenario 2: create all supported release archives
 * command: ./gradlew clean runtimeZipAll
 * Note: release archives are located in the /build/image/ directory
 */
plugins {
    id 'application'
    id 'idea'
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

def javafxVersion = "25.0.1"
def bouncyCastleVersion = "1.84"
def currentJavafxPlatform = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isWindows() ? "win" :
    (org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isMacOsX() ? "mac" : "linux")

//Version is defined in gradle.properties so that we can CLI override it for nightly builds.
version = project.findProperty('projectVersion')

def updateTrack = (project.findProperty('updateTrack') ?: 'none').toString()
def updateBuild = (project.findProperty('updateBuild') ?: '0').toString()

if(!(updateTrack in ['alpha', 'nightly', 'none'])) {
    throw new GradleException("updateTrack must be 'alpha', 'nightly', or 'none'")
}

if(!(updateBuild ==~ /\d+/)) {
    throw new GradleException('updateBuild must be a non-negative integer')
}

def releaseVersion = version.toString()
def releaseNotesDirectory = file('src/main/resources/release-notes')
def releaseNotesMetadataFile = file("${releaseNotesDirectory}/${releaseVersion}.properties")
def releaseNotesHtmlFile = file("${releaseNotesDirectory}/${releaseVersion}.html")
def isNumberedPublicRelease = { String candidate ->
    def normalized = candidate.toLowerCase(Locale.US)
    !normalized.contains('nightly') && !normalized.contains('snapshot') && !normalized.contains('dev')
}

tasks.register('verifyUpdateChannelMetadata') {
    group = 'verification'
    description = 'Checks that packaged version and updater metadata identify the same release channel.'
    inputs.property('releaseVersion', releaseVersion)
    inputs.property('updateTrack', updateTrack)
    inputs.property('updateBuild', updateBuild)

    doLast {
        long numericBuild

        try {
            numericBuild = Long.parseLong(updateBuild)
        } catch(NumberFormatException e) {
            throw new GradleException('updateBuild exceeds the supported 64-bit integer range', e)
        }

        if(updateTrack == 'none') {
            if(isNumberedPublicRelease(releaseVersion)) {
                throw new GradleException("Numbered release ${releaseVersion} must use the alpha update channel")
            }

            if(numericBuild != 0L) {
                throw new GradleException('A build with updateTrack=none must use updateBuild=0')
            }
        } else if(updateTrack == 'alpha') {
            if(!(releaseVersion ==~ /\d+\.\d+\.\d+-alpha-\d+/)) {
                throw new GradleException("Alpha update metadata requires an Alpha version, not ${releaseVersion}")
            }

            if(numericBuild <= 0L) {
                throw new GradleException('An Alpha package must have a positive updateBuild')
            }
        } else if(updateTrack == 'nightly') {
            if(!releaseVersion.toLowerCase(Locale.US).contains('nightly')) {
                throw new GradleException("Nightly update metadata requires a nightly version, not ${releaseVersion}")
            }

            if(numericBuild <= 0L) {
                throw new GradleException('A nightly package must have a positive updateBuild')
            }
        }
    }
}

tasks.register('verifyReleaseNotesContent') {
    group = 'verification'
    description = 'Checks that the current numbered version has complete rich-text release notes.'
    inputs.property('releaseVersion', releaseVersion)

    if(isNumberedPublicRelease(releaseVersion)) {
        inputs.files(releaseNotesMetadataFile, releaseNotesHtmlFile)
    }

    doLast {
        if(!isNumberedPublicRelease(releaseVersion)) {
            return
        }

        if(!releaseNotesMetadataFile.isFile() || !releaseNotesHtmlFile.isFile()) {
            throw new GradleException("Public release ${releaseVersion} requires ${releaseNotesMetadataFile} and ${releaseNotesHtmlFile}")
        }

        def metadata = new Properties()
        releaseNotesMetadataFile.withReader('UTF-8') { reader -> metadata.load(reader) }

        if(metadata.getProperty('version', '').trim() != releaseVersion) {
            throw new GradleException("Release-note version must exactly match projectVersion ${releaseVersion}")
        }

        if(metadata.getProperty('title', '').trim().isEmpty()) {
            throw new GradleException("Release-note title is missing for ${releaseVersion}")
        }

        def html = releaseNotesHtmlFile.getText('UTF-8')
        ['What', 'Added', 'Changed', 'Fixed', 'Removed', 'Before You Upgrade'].each { heading ->
            if(!html.contains(heading)) {
                throw new GradleException("Release notes for ${releaseVersion} are missing the '${heading}' section")
            }
        }

        def plainWords = html.replaceAll('<[^>]+>', ' ').trim().split('\\s+').findAll { !it.isBlank() }
        if(plainWords.size() < 150) {
            throw new GradleException("Release notes for ${releaseVersion} are too brief (${plainWords.size()} words)")
        }
    }
}

tasks.register('verifyApprovedReleaseNotes') {
    group = 'verification'
    description = 'Stops public packaging until the versioned release notes have explicit human approval.'
    dependsOn('verifyReleaseNotesContent')
    inputs.property('releaseVersion', releaseVersion)

    if(isNumberedPublicRelease(releaseVersion)) {
        inputs.file(releaseNotesMetadataFile)
    }

    doLast {
        if(!isNumberedPublicRelease(releaseVersion)) {
            return
        }

        def metadata = new Properties()
        releaseNotesMetadataFile.withReader('UTF-8') { reader -> metadata.load(reader) }

        if(!metadata.getProperty('status', '').trim().equalsIgnoreCase('approved')) {
            throw new GradleException("Release notes for ${releaseVersion} are still a draft. Stop, obtain user approval, then set status=approved in ${releaseNotesMetadataFile}.")
        }
    }
}

def publicPackagingTasks = [
