tasks.withType(JavaCompile) {
    options.compilerArgs.add("--add-modules=${compileModules.join(',')}")
}

/**
 * Common JVM Arguments for classpath launches.
 */
def jvmArgsClasspath =
        ['--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED', //Needed for controls-fx.jar
         "--add-modules=${compileModules.join(',')}",
         '--enable-native-access=ALL-UNNAMED', //Suppress unsafe warnings for FFM API Foreign Memory calls
         '--enable-native-access=javafx.graphics'] + //JDK24 - suppress restricted java.lang.System calls
        commonPerformanceJvmArgs

/**
 * JVM Arguments for running the application on Windows.
 */
def jvmArgsWindows = jvmArgsClasspath +
        ['--add-exports=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED', //windows users for JIDE
         '-Djava.library.path=c:\\Program Files\\SDRplay\\API\\x64'] //SDRPlay API library path

/**
 * JVM Arguments for running the application on Linux.
 */
def jvmArgsLinux = jvmArgsClasspath

/**
 * JVM Arguments for running the application on macOS.
 */
def jvmArgsMac = jvmArgsLinux

/**
 * JVM arguments for application-plugin launchers.  This must follow the requested JavaFX target platform instead
 * of the host build OS so cross-built Windows distributions include the Windows/JIDE exports.
 */
def applicationJvmArgs = javafxPlatform == "win" ? jvmArgsWindows : (javafxPlatform == "mac" ? jvmArgsMac : jvmArgsLinux)

/**
 * JVM Arguments for running the JPMS application on macOS.
 */
def jpmsJvmArgsMac =
        ['--add-exports=javafx.base/com.sun.javafx.event=org.controlsfx.controls', //Needed for controls-fx.jar
         '-Dsdrtrunk.stats.web.root=$APPDIR/stats-web',
         '--enable-native-access=com.sun.jna,javafx.graphics,usb4java,sdr.trunk,org.xerial.sqlitejdbc'] +
        commonPerformanceJvmArgs

