def jpmsGeneratedLibDir = layout.buildDirectory.dir('jpms-libs')
def jpmsModuleInfoSource = layout.projectDirectory.file('src/jpms/java/module-info.java')
def jpmsModuleInfoOutputDir = layout.buildDirectory.dir('jpms-module-info')
def jpmsModuleDir = layout.buildDirectory.dir('jpms-module')
def jpmsModsDir = layout.buildDirectory.dir('jpms-mods')
def jpmsClassesDir = layout.buildDirectory.dir('classes/java/main')
def jpmsAppJar = layout.buildDirectory.file('jpms-module/sdrtrunk-vce-jpms.jar')
def jpmsMainModule = 'sdr.trunk/io.github.dsheirer.gui.SDRTrunk'
def jpmsExcludedJarPattern = ~/(sdrtrunk-vce-.*|javafx-.*|java-lame-.*|usb4java-native-libraries-.*|usb4java-1\.3\.[05]\.jar|libusb4java-1\.3\.0-.*)/
