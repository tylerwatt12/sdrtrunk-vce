tasks.register('jpmsRun', Exec) {
    dependsOn('syncJpmsMods')

    inputs.dir(jpmsModsDir)

    doFirst {
        executable = "${java25Home.get()}/bin/java"
        args = [
                '--module-path', jpmsModsDir.get().asFile.absolutePath
        ] + jpmsJvmArgsMac + ['-m', jpmsMainModule]
    }
}

tasks.register('syncJpmsMods', Sync) {
    dependsOn('jpmsJar')

    into(jpmsModsDir)
    from(jpmsRuntimeJars)
    from(jpmsGeneratedJars)
    from(jpmsAppJar)
}

tasks.register('compileJpmsModuleInfo', Exec) {
    dependsOn('installDist', 'mergeUsb4javaNatives', 'jpmsJavaLame')

    inputs.file(jpmsModuleInfoSource)
    inputs.dir(jpmsClassesDir)
    inputs.files(jpmsRuntimeJars)
    inputs.files(jpmsGeneratedJars)
    outputs.dir(jpmsModuleInfoOutputDir)

    doFirst {
        jpmsModuleInfoOutputDir.get().asFile.deleteDir()
        jpmsModuleInfoOutputDir.get().asFile.mkdirs()

        List<File> modulePathFiles = jpmsRuntimeJars.files.sort { it.name }
        modulePathFiles.addAll(jpmsGeneratedJars.files.sort { it.name })

        executable = "${java25Home.get()}/bin/javac"
        args = [
                '--module-path', modulePathFiles.collect { it.absolutePath }.join(File.pathSeparator),
                '--patch-module', "sdr.trunk=${jpmsClassesDir.get().asFile.absolutePath}",
                '-d', jpmsModuleInfoOutputDir.get().asFile.absolutePath,
                jpmsModuleInfoSource.asFile.absolutePath
        ]
    }
}

tasks.register('jpmsJar', Jar) {
    dependsOn('compileJpmsModuleInfo')

    archiveFileName = jpmsAppJar.get().asFile.name
    destinationDirectory = jpmsModuleDir
    manifest {
        from(tasks.named('jar', Jar).get().manifest)
    }
    from(jpmsClassesDir)
    from(layout.buildDirectory.dir('resources/main'))
    from(jpmsModuleInfoOutputDir) {
        include 'module-info.class'
    }
}

/**
 * Configures the runtime zip task with additional options/settings.
 * @param rt task to configure
 * @param jvmArgs to use (windows or linux)
 * @return configured task.
 */
def configureRuntime = { def task, List<String> jvmArgs ->
    //Use the correct set of JVM arguments
    task.extension.launcherData.get().jvmArgs = jvmArgs
    task.extension.launcherData.get().unixScriptTemplate = unixScriptTemplateFile

    task.extension.addModules(*runtimeModules)

    //Use auto-detected modules and 'add' any specified modules.
    task.extension.additive.set(true)

    //Recommended options for reducing/shrinking runtime target image size
    task.extension.addOptions('--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages')
}

def configure = { org.beryx.runtime.RuntimeZipTask rt, List<String> jvmArgs ->
    configureRuntime(rt, jvmArgs)

    //Runtime images have auto appended version in image zip name.  Override to include version in single target image.
    rt.extension.imageZip.set(layout.buildDirectory.file('image/sdrtrunk-vce.zip'))
}

runtime {
    distDir.set(layout.buildDirectory.dir('install/sdrtrunk-vce'))
    javaHome.set(java25Home)

    launcher {
        jvmArgs = applicationJvmArgs
        unixScriptTemplate = unixScriptTemplateFile
    }

    addModules(*runtimeModules)
    additive.set(true)
    addOptions('--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages')

}

/**
 * Creates a release package for the current operating system.
 *
 * Usage: gradle runtimeZipCurrent
 * Usage: gradlew runtimeZipCurrent   (windows - using gradlew)
 * Usage: ./gradlew runtimeZipCurrent   (linux/macos - using gradlew)
 */
if(os.isMacOsX())
{
    def macImageOutputDir = layout.buildDirectory.dir('image')
    def macAppBundle = layout.buildDirectory.dir('image/sdrtrunk-vce.app')
    def macRuntimeImageDir = layout.buildDirectory.dir('jre-current')
    def macInstallDistDir = layout.buildDirectory.dir('install/sdrtrunk-vce')
    def macRuntimeZipRootDir = layout.buildDirectory.dir('runtime-current/sdrtrunk-vce')
    def macJpackageInputDir = layout.buildDirectory.dir('jpackage-input')
    def macIconFile = layout.projectDirectory.file('src/main/packaging/macos/sdr-trunk.icns')
    def macInfoPlist = macAppBundle.map {it.file('Contents/Info.plist')}
    def macJpackageScript = layout.projectDirectory.file('src/main/packaging/macos/create-app-image.sh')

    tasks.register('jreCurrent', Exec) {
        inputs.property('runtimeModules', runtimeModules)
        outputs.dir(macRuntimeImageDir)

        doFirst {
            macRuntimeImageDir.get().asFile.deleteDir()

            executable = "${java25Home.get()}/bin/jlink"
            args = [
                    '--module-path', "${java25Home.get()}/jmods",
                    '--add-modules', runtimeModules.join(','),
                    '--output', macRuntimeImageDir.get().asFile.absolutePath,
                    '--strip-debug',
                    '--compress', 'zip-6',
                    '--no-header-files',
                    '--no-man-pages'
            ]
        }
    }

    tasks.register('runtimeImageCurrent', Sync) {
        dependsOn('jreCurrent', 'installDist')

        doFirst {
            macRuntimeZipRootDir.get().asFile.deleteDir()
        }

        into(macRuntimeZipRootDir)
        from(macInstallDistDir)
        from(macRuntimeImageDir) {
            into 'runtime'
        }
    }

    tasks.register('runtimeZipCurrent', Zip) {
        dependsOn('runtimeImageCurrent')

        archiveFileName = 'sdrtrunk-vce.zip'
        destinationDirectory = layout.buildDirectory.dir('image')
        from(layout.buildDirectory.dir('runtime-current')) {
            include 'sdrtrunk-vce/**'
        }
    }

    tasks.register('stageMacWebAssets', Sync) {
        into(macJpackageInputDir)
        from('stats-web') {
            into 'stats-web'
        }
        from('LICENSE')
        from('NOTICE')
    }

    tasks.register('image', Exec) {
        dependsOn('jreCurrent', 'syncJpmsMods', 'stageMacWebAssets')

        inputs.dir(jpmsModsDir)
        inputs.file(macIconFile)
        inputs.file(macJpackageScript)
        inputs.dir(macRuntimeImageDir)
        inputs.dir(macJpackageInputDir)
        outputs.dir(macAppBundle)

        doFirst {
            macAppBundle.get().asFile.deleteDir()

            def jpackageArgs = [
                    '--type', 'app-image',
                    '--dest', macImageOutputDir.get().asFile.absolutePath,
                    '--name', 'sdrtrunk-vce',
                    '--input', macJpackageInputDir.get().asFile.absolutePath,
                    '--module-path', jpmsModsDir.get().asFile.absolutePath,
                    '--module', jpmsMainModule,
                    '--runtime-image', macRuntimeImageDir.get().asFile.absolutePath,
                    '--app-version', macAppVersion,
                    '--icon', macAppIcon
            ]

            jpmsJvmArgsMac.each { jvmArg ->
                jpackageArgs.add('--java-options')
                jpackageArgs.add(jvmArg)
            }

            executable = '/bin/sh'
            args = [macJpackageScript.asFile.absolutePath, "${java25Home.get()}/bin/jpackage",
                    macInfoPlist.get().asFile.absolutePath] + jpackageArgs
        }
    }

    tasks.register('macAppZip', Exec) {
        dependsOn('image')
        def archive = layout.buildDirectory.file("image/sdrtrunk-vce-macos-app-aarch64-v${version}.zip")
        inputs.dir(macAppBundle)
        outputs.file(archive)

        doFirst {
            archive.get().asFile.delete()
            executable = '/usr/bin/ditto'
            args = ['-c', '-k', '--sequesterRsrc', '--keepParent', macAppBundle.get().asFile.absolutePath,
                    archive.get().asFile.absolutePath]
        }
    }
}
else
{
    tasks.register('runtimeZipCurrent', org.beryx.runtime.RuntimeZipTask) {rt ->
        def arch = System.properties.getProperty("os.arch")
        def javaHome = org.gradle.internal.jvm.Jvm.current().getJavaHome().toString()

        if(os.isWindows()) {
            if(arch.equals("amd64")) {
                rt.extension.targetPlatform(targetWindowsX86_64, javaHome)
            }
            else if(arch.equals("aarch64")) {
                rt.extension.targetPlatform(targetWindowsAarch64, javaHome)
            }
            configure(rt, jvmArgsWindows)
        }
        else if(os.isLinux())
        {
            if(arch.equals("amd64")) {
                rt.extension.targetPlatform(targetLinuxX86_64, javaHome)
            }
            else if(arch.equals("aarch64")) {
                rt.extension.targetPlatform(targetLinuxAarch64, javaHome)
            }
            configure(rt, jvmArgsLinux)
        }
    }
}


/**
 * Creates a Windows release package.
 *
 * Note: you cannot create both Windows and Linux releases at the same time due to limitations of the Runtime plugin
 *
 * Usage: gradle runtimeZipWindows
 * Usage: gradlew runtimeZipWindows   (windows - using gradlew)
 * Usage: ./gradlew runtimeZipWindows   (linux - using gradlew)
 */
tasks.register('runtimeZipWindows', org.beryx.runtime.RuntimeZipTask) {rt ->
    //Windows aarch64
    if(file(jdk_windows_aarch64).exists()) {
        rt.extension.targetPlatform(targetWindowsAarch64, jdk_windows_aarch64, [])
    }
    else {
        rt.extension.targetPlatform(targetWindowsAarch64) {
            jdkHome = jdkDownload(jdk_download_windows_aarch64)
        }
    }
    //Windows x86-64
    if(file(jdk_windows_x86_64).exists()) {
        rt.extension.targetPlatform(targetWindowsX86_64, jdk_windows_x86_64, [])
    }
    else {
        rt.extension.targetPlatform(targetWindowsX86_64) {
            jdkHome = jdkDownload(jdk_download_windows_x86_64)
        }
    }

    configure(rt, jvmArgsWindows)
}

