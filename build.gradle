import java.text.SimpleDateFormat
import io.github.dsheirer.build.*



/**
 * Instructions for building/compiling the sdrtrunk application.
 *
 * Prerequisites:
 * Install and configure a Java 25 JDK that includes JavaFX modules (for example, BellSoft Liberica JDK Full)
 * - Optional: install and configure Gradle 8.10+
 * - macOS ARM release packaging: ARM Mac with Xcode command line tools, or a verified native build directory
 *   supplied with -PmacosUsbNativeDirectory=/path/to/prepared/natives
 *
 * Scenario 1: run the application via gradle command line from the source code root directory:
 * command: ./gradlew run
 *
 * Scenario 2: create all supported release archives
 * command: ./gradlew clean runtimeZipAll
 * Note: release archives are located in the /build/image/ directory
 */
plugins {
    id 'application'
    id 'idea'
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

def javafxVersion = "25.0.1"
def bouncyCastleVersion = "1.84"
def currentJavafxPlatform = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isWindows() ? "win" :
    (org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isMacOsX() ? "mac" : "linux")

//Version is defined in gradle.properties so that we can CLI override it for nightly builds.
version = project.findProperty('projectVersion')

def updateTrack = (project.findProperty('updateTrack') ?: 'none').toString()
def updateBuild = (project.findProperty('updateBuild') ?: '0').toString()

if(!(updateTrack in ['alpha', 'nightly', 'none'])) {
    throw new GradleException("updateTrack must be 'alpha', 'nightly', or 'none'")
}

if(!(updateBuild ==~ /\d+/)) {
    throw new GradleException('updateBuild must be a non-negative integer')
}

def releaseVersion = version.toString()
def releaseNotesDirectory = file('src/main/resources/release-notes')
def releaseNotesMetadataFile = file("${releaseNotesDirectory}/${releaseVersion}.properties")
def releaseNotesHtmlFile = file("${releaseNotesDirectory}/${releaseVersion}.html")
tasks.register('verifyUpdateChannelMetadata', VerifyUpdateChannelMetadata) { task ->
    group = 'verification'
    description = 'Checks that packaged version and updater metadata identify the same release channel.'
    task.releaseVersion = releaseVersion
    task.updateTrack = updateTrack
    task.updateBuild = updateBuild
}

tasks.register('verifyReleaseNotesContent', VerifyReleaseNotes) { task ->
    group = 'verification'
    description = 'Checks that the current numbered version has complete rich-text release notes.'
    task.releaseVersion = releaseVersion
    task.requireApproval = false
    if(VerifyReleaseNotes.numbered(releaseVersion)) {
        task.metadataFile = releaseNotesMetadataFile
        task.htmlFile = releaseNotesHtmlFile
    }
}

tasks.register('verifyApprovedReleaseNotes', VerifyReleaseNotes) { task ->
    group = 'verification'
    description = 'Stops public packaging until the versioned release notes have explicit human approval.'
    dependsOn('verifyReleaseNotesContent')
    task.releaseVersion = releaseVersion
    task.requireApproval = true
    if(VerifyReleaseNotes.numbered(releaseVersion)) task.metadataFile = releaseNotesMetadataFile
}

def publicPackagingTasks = [
    'distTar', 'distZip', 'runtimeZipAll'
] as Set
tasks.configureEach { candidate ->
    if(publicPackagingTasks.contains(candidate.name)) {
        candidate.dependsOn('verifyApprovedReleaseNotes')
        candidate.dependsOn('verifyBundledApplicationDatabaseMigrator')
        candidate.dependsOn('verifyUpdateChannelMetadata')
    }
}

//Java 25 is required for this version of the Project Panama preview/incubator feature
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def radioSystemCatalogInput = providers.gradleProperty('radioSystemCatalogFile')
def radioSystemCatalogOutput = layout.buildDirectory.file('generated/radio-system-names/dsdplus.networks')
//Capture plain values during configuration so the action does not access the build script at execution time.
def radioSystemCatalogScript = file('tools/build/fetch_dsdplus_networks.py')
def radioSystemCatalogOutputPath = radioSystemCatalogOutput.get().asFile.absolutePath
def radioSystemCatalogSource = radioSystemCatalogInput.isPresent() ? file(radioSystemCatalogInput.get()) : null
def radioSystemCatalogPython = providers.gradleProperty('catalogPython').getOrElse(
        org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isWindows() ?
                'python' : 'python3')

tasks.register('prepareRadioSystemCatalog', Exec) {
    group = 'build'
    description = 'Fetches one immutable DSDPlus network-name snapshot, or validates an explicit local snapshot.'
    inputs.file(radioSystemCatalogScript)
    inputs.property('catalogSource', radioSystemCatalogInput.orElse('latest-public-wiki'))
    if(radioSystemCatalogSource != null) inputs.file(radioSystemCatalogSource)
    outputs.file(radioSystemCatalogOutput)
    // A new build without an explicit snapshot checks the current source once, rather than reusing yesterday's data.
    outputs.upToDateWhen { radioSystemCatalogSource != null }
    doFirst {
        def arguments = [radioSystemCatalogPython, radioSystemCatalogScript.absolutePath,
                '--output', radioSystemCatalogOutputPath]
        if(radioSystemCatalogSource != null) arguments += ['--source-file', radioSystemCatalogSource.absolutePath]
        commandLine(arguments)
    }
}

processResources {
    dependsOn('prepareRadioSystemCatalog')
    from(radioSystemCatalogOutput) {
        into 'radio-systems'
    }
    from('LICENSE') {
        rename 'LICENSE', 'GPL-3.0.txt'
    }
}

dependencies {
