    // relying on a specific JDK distribution to bundle the modules.
    implementation "org.openjfx:javafx-base:${javafxVersion}:${currentJavafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${currentJavafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${currentJavafxPlatform}"
    implementation "org.openjfx:javafx-swing:${javafxVersion}:${currentJavafxPlatform}"

    // JUnit Tests
    testImplementation(platform("org.junit:junit-bom:6.0.1"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.1'
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:6.0.1")
    testImplementation("org.junit.platform:junit-platform-launcher")

    //Jitpack imports
    implementation 'com.github.dnault:libresample4j:master'
    implementation 'com.github.DSheirer.jmbe:jmbe-api:1.0.0'
    implementation 'com.github.nwaldispuehl:java-lame:v3.98.4'

    //mavenCentral/jcenter imports
    implementation 'ch.qos.logback:logback-classic:1.5.21'
    implementation 'ch.qos.logback:logback-core:1.5.21'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.1'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
    implementation 'com.github.jiconfont:jiconfont-font_awesome:4.7.0.1'
    implementation 'com.github.jiconfont:jiconfont-javafx:1.0.0'
    implementation 'com.github.jiconfont:jiconfont-swing:1.0.1'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.mpatric:mp3agic:0.9.1'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'io.github.dsheirer:radio-reference-api:18.0.0'
    implementation 'io.github.dsheirer:usb4java-native-libraries:1.3.3' //OSX & Windows aarch64 native libs
    implementation('io.github.dsheirer:usb4java:1.3.5') { //Fork with Loader support for OSX Multi-Version
        exclude group: 'org.usb4java', module: 'usb4java-javax'
        exclude group: 'org.junit'
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.platform'
        exclude group: 'org.junit.vintage'
        exclude group: 'junit'
        exclude group: 'org.hamcrest'
        exclude group: 'org.opentest4j'
        exclude group: 'org.apiguardian'
    }
    implementation 'javax.usb:usb-api:1.0.2'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.mina:mina-core:2.2.4'
    implementation 'org.apache.mina:mina-http:2.2.4'
    implementation "org.bouncycastle:bcpkix-jdk18on:${bouncyCastleVersion}"
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    implementation 'org.usb4java:libusb4java:1.3.0'
    //These native payloads used to arrive through the unused javax.usb adapter. Keep every supported platform.
    ['linux-x86', 'linux-x86-64', 'win32-x86', 'win32-x86-64', 'darwin-x86-64', 'linux-arm',
     'linux-aarch64'].each { platform ->
        runtimeOnly "org.usb4java:libusb4java:1.3.0:${platform}"
    }
    implementation 'pl.edu.icm:JLargeArrays:1.6'
}

//Release images bundle target-specific Liberica runtimes that already contain JavaFX. Keep OpenJFX on the compile
//classpath, but do not copy host-classifier JavaFX jars into cross-platform distributions.
configurations.runtimeClasspath {
    exclude group: 'org.openjfx'
}

def compileModules = ['jdk.incubator.vector', 'jdk.httpserver']
def commonPerformanceJvmArgs = ['-Xmx2g', '-XX:+UseCompactObjectHeaders']

tasks.withType(JavaCompile) {
    options.compilerArgs.add("--add-modules=${compileModules.join(',')}")
}

/**
 * Common JVM Arguments for classpath launches.
 */
def jvmArgsClasspath =
        ["--add-modules=${compileModules.join(',')}",
         '--enable-native-access=ALL-UNNAMED', //Suppress unsafe warnings for FFM API Foreign Memory calls
         '--enable-native-access=javafx.graphics'] + //JDK24 - suppress restricted java.lang.System calls
        commonPerformanceJvmArgs

application {
    mainClass = "io.github.dsheirer.gui.SDRTrunk"
    applicationDefaultJvmArgs = jvmArgsClasspath
}

distributions {
    main {
        contents {
            from('stats-web') {
                into 'stats-web'
            }
            from('LICENSE')
            from('NOTICE')
        }
    }
}

def testGroup = providers.gradleProperty('testGroup').orElse('all').get()
def testGroups = ['all', 'core', 'migrations', 'activity', 'web', 'http', 'platform-filesystem']
if(!(testGroup in testGroups)) {
    throw new GradleException("testGroup must be one of: ${testGroups.join(', ')}")
}
def webTestClassPatterns = ['io/github/dsheirer/stats/**', 'io/github/dsheirer/web/**']
def migrationTestClassPatterns = ['io/github/dsheirer/database/upgrade/**']
def activityTestClassPatterns = ['io/github/dsheirer/stats/activity/**']
def statsHttpTestClassPatterns = ['io/github/dsheirer/stats/**/*Http*Test*']

test {
    if(testGroup != 'all') {
        timeout = java.time.Duration.ofMinutes(8)
        testLogging.events('started', 'failed', 'skipped')
    }
    useJUnitPlatform {
        if(testGroup == 'platform-filesystem') includeTags('platform-filesystem')
    }
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('tmp/test').get().asFile.absolutePath
    jvmArgs = jvmArgsClasspath
    // Separate CI runners partition whole classes; ordinary local checks retain the complete suite.
    if(testGroup == 'core') {
        exclude(webTestClassPatterns + migrationTestClassPatterns)
    }
    else if(testGroup == 'migrations') {
        include(migrationTestClassPatterns)
        maxParallelForks = 2
    }
    else if(testGroup == 'activity') {
        include(activityTestClassPatterns)
    }
    else if(testGroup == 'web') {
        include('io/github/dsheirer/stats/**')
        exclude(activityTestClassPatterns + statsHttpTestClassPatterns)
    }
    else if(testGroup == 'http') {
        include(['io/github/dsheirer/web/**'] + statsHttpTestClassPatterns)
        exclude(activityTestClassPatterns)
    }
}

def runtimeManifestClassPath = configurations.runtimeClasspath.elements.map { entries ->
    entries.collect { new URI(null, null, it.asFile.name, null).toASCIIString() }.join(' ')
}

jar {
    inputs.property('runtimeManifestClassPath', runtimeManifestClassPath)

    manifest {
        attributes (
                'Class-Path'            : runtimeManifestClassPath,
                'Implementation-Title'  : 'VCE project',
                'Implementation-Version' : archiveVersion,
                'Update-Track'           : updateTrack,
                'Update-Build'           : updateBuild,
                'Created-By'            : "Gradle ${gradle.gradleVersion}",
                'Build-Timestamp'       : new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                'Build-JDK'             : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']}",
                'Build-OS'              : "${System.properties['os.name']} (${System.properties['os.arch']} ${System.properties['os.version']}"
        )
    }
}

