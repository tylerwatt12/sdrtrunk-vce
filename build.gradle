runtimeTargets = runtimeTargets.collect { descriptor ->
    def values = descriptor.collectEntries { key, value ->
        [(key): value instanceof GString ? value.toString() : value]
    }
    new RuntimeTarget(values + [archiveFile: new File(runtimeCacheDirectory, values.archiveName),
            packageRoot: values.targetName])
}

//Only evaluated while configuring the task graph; no task action calls back into the project.
def runtimeArchiveTree = { RuntimeTarget target ->
    target.archiveType == 'zip' ? zipTree(target.archiveFile) : tarTree(resources.gzip(target.archiveFile))
}

//Gradle expands TAR symlinks as empty files. Materialize BellSoft's legal-file links so every notice remains readable.
def legalLinkSourceByName = [
        'ADDITIONAL_LICENSE_INFO': 'legal/java.base/ADDITIONAL_LICENSE_INFO',
        'ASSEMBLY_EXCEPTION': 'legal/java.base/ASSEMBLY_EXCEPTION',
        'LICENSE': 'legal/java.base/LICENSE',
        'cldr.md': 'legal/java.base/cldr.md',
        'mesa3d.md': 'legal/java.desktop/mesa3d.md',
        'pipewire.md': 'legal/java.desktop/pipewire.md'
]
def expectedMaterializedLegalLinks = 174


def runtimeDownloadTasks = [:]
def runtimeLegalTasks = [:]
def runtimeLegalDirectories = [:]
runtimeTargets.each { target ->
    runtimeDownloadTasks[target.id] = tasks.register("downloadLiberica${target.id}", DownloadVerifiedRuntime) { task ->
        group = 'distribution'
        description = "Downloads the pinned BellSoft JRE for ${target.targetName}."
        task.url = target.url
        task.size = target.size
        task.sha256 = target.sha256
        task.archiveFile = target.archiveFile
    }
}

runtimeTargets.findAll { !it.windows }.each { target ->
    File materializedDirectory = layout.buildDirectory.dir("generated/runtime-legal/${target.id}").get().asFile
    runtimeLegalDirectories[target.id] = materializedDirectory
    runtimeLegalTasks[target.id] = tasks.register("materializeRuntimeLegalLinks${target.id}", MaterializeRuntimeLegalLinks) { task ->
        dependsOn(runtimeDownloadTasks[target.id])
        task.archiveFile = target.archiveFile
        task.archiveContents = runtimeArchiveTree(target)
        task.archiveRoot = target.archiveRoot
        task.archiveName = target.archiveName
        task.legalLinkSources = legalLinkSourceByName
        task.expectedLegalLinks = expectedMaterializedLegalLinks
        task.outputDirectory = materializedDirectory
    }
}

tasks.named('startScripts') {
    classpath = files(tasks.named('jar'))
}

def applicationInstallDirectory = layout.buildDirectory.dir("install/${packagedApplicationName}")
//The upstream Tahoe JNI payload links to a MacPorts installation outside the release ZIP. Rebuild it with
//pinned static libusb, retaining the legacy macOS and Windows resources from the original dependency.
def macosUsbNativeDirectory = layout.buildDirectory.dir('generated/macos-usb')
def macosUsbNativeJarName = 'usb4java-native-libraries-1.3.3.jar'
def upstreamMacosUsbNativeJar = configurations.runtimeClasspath.elements.map { entries ->
    entries.find { it.asFile.name == macosUsbNativeJarName }.asFile
}
def macosUsbPrebuiltDirectory = providers.gradleProperty('macosUsbNativeDirectory')
def prepareMacosUsbNatives = tasks.register('prepareMacosUsbNatives', PrepareMacosUsbNatives) { task ->
    group = 'distribution'
    description = 'Builds a self-contained macOS ARM USB library from pinned sources (requires macOS ARM).'
    task.scriptFile = file('tools/build/build_macos_usb.py')
    task.nativeJar.fileProvider(upstreamMacosUsbNativeJar)
    task.outputDirectory.set(macosUsbNativeDirectory)
    if(macosUsbPrebuiltDirectory.isPresent()) task.prebuiltDirectory.set(file(macosUsbPrebuiltDirectory.get()))
}

def packageTasks = []

runtimeTargets.each { target ->
    def packageTask = tasks.register("runtimeZip${target.id}", VerifiedRuntimeZip) { task ->
        description = "Packages ${target.targetName} with its complete BellSoft JRE."
        dependsOn(runtimeDownloadTasks[target.id])
        dependsOn(tasks.named('installDist'))
        dependsOn('verifyApprovedReleaseNotes')
        dependsOn('verifyBundledApplicationDatabaseMigrator')
        dependsOn('verifyBundledVoiceDecryption')
        task.target = target
        task.applicationName = packagedApplicationName
        task.releaseVersion = releaseVersion
        task.updateTrack = updateTrack
        task.updateBuild = updateBuild
        task.libericaJavaVersion = libericaJavaVersion
        task.libericaRuntimeVersion = libericaRuntimeVersion
        task.expectedManifestClassPath.set(runtimeManifestClassPath)
        task.requiredVoiceEntries = bundledVoiceDecryptionEntries
        task.retiredVoiceEntries = retiredEncryptionEntries
        task.retiredVoicePrefixes = retiredEncryptionPrefixes
        dependsOn('verifyUpdateChannelMetadata')

        if(!target.windows) {
            dependsOn(runtimeLegalTasks[target.id])
        }
        if(target.id == 'OsxAarch64') {
            dependsOn(prepareMacosUsbNatives)
        }

        archiveFileName = "${target.packageRoot}.zip"
        destinationDirectory = layout.buildDirectory.dir('image')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        includeEmptyDirs = false
        zip64 = true

        from(runtimeArchiveTree(target)) {
            into(target.packageRoot)

            eachFile(new RuntimeLayoutAction(target))
        }

        if(!target.windows) {
            from(runtimeLegalDirectories[target.id]) {
                into(target.packageRoot)
            }
        }

        from("packaging/launchers/${target.rootLauncher}") {
            into(target.packageRoot)

            if(!target.windows) {
                filePermissions { unix('rwxr-xr-x') }
            }
        }

        from(applicationInstallDirectory) {
            into(target.packageRoot)
            if(target.id == 'OsxAarch64') {
                exclude "lib/${macosUsbNativeJarName}"
            }

            eachFile(new ApplicationLauncherPermissionsAction(packagedApplicationName))
        }

        if(target.id == 'OsxAarch64') {
            from(macosUsbNativeDirectory.map { it.file(macosUsbNativeJarName) }) {
                into("${target.packageRoot}/lib")
            }
            from(macosUsbNativeDirectory.map { it.dir('legal/native-usb') }) {
                into("${target.packageRoot}/legal/native-usb")
            }
        }

    }

    packageTasks.add(packageTask)
}

tasks.register('runtimeZipAll', VerifyRuntimeArchiveSet) { task ->
    group = 'distribution'
    description = 'Builds one application distribution and packages all six supported OS/CPU archives.'
    dependsOn(packageTasks)
    task.expectedArchives = runtimeTargets.collect { "${it.packageRoot}.zip".toString() }
    task.imageDirectory.set(layout.buildDirectory.dir('image'))
    task.archives.from(fileTree(layout.buildDirectory.dir('image')) {
        include "vce-*-${packageVersion}.zip"
    })
}
