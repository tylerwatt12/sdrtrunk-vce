tasks.register('verifyBundledVoiceDecryption', VerifyJarEntries) { task ->
    description = 'Verifies the application JAR includes all bundled voice decryption providers.'
    task.archive.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    task.componentName = 'Bundled voice decryption'
    task.requiredEntries = bundledVoiceDecryptionEntries
