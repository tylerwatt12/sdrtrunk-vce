def fileDigest = { File source, String algorithm ->
    MessageDigest digest = MessageDigest.getInstance(algorithm)
    byte[] buffer = new byte[64 * 1024]

    source.withInputStream { input ->
        int count

        while((count = input.read(buffer)) >= 0) {
            if(count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }

    digest.digest().encodeHex().toString()
}

def cachedRuntimeIsValid = { Map target ->
    File archive = target.archiveFile as File
    archive.isFile() && archive.length() == (target.size as long) &&
            fileDigest(archive, 'SHA-256') == target.sha256
}

