//Release images bundle target-specific Liberica runtimes that already contain JavaFX. Keep OpenJFX on the compile
//classpath, but do not copy host-classifier JavaFX jars into cross-platform distributions.
configurations.runtimeClasspath {
    exclude group: 'org.openjfx'
}

def usb4javaRuntimeJar = configurations.detachedConfiguration(dependencies.create('io.github.dsheirer:usb4java:1.3.5'))
usb4javaRuntimeJar.transitive = false

def usb4javaNativeLibrariesJar = configurations.detachedConfiguration(
        dependencies.create('io.github.dsheirer:usb4java-native-libraries:1.3.3'))
usb4javaNativeLibrariesJar.transitive = false

def javaLameRuntimeJar = configurations.detachedConfiguration(dependencies.create('com.github.nwaldispuehl:java-lame:v3.98.4'))
javaLameRuntimeJar.transitive = false

// JPMS bridge: the forked usb4java jar must see the native resources through its own module class loader.
tasks.register('mergeUsb4javaNatives', Jar) {
    archiveFileName = 'usb4java-1.3.5-merged.jar'
    destinationDirectory = layout.buildDirectory.dir('jpms-libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(usb4javaRuntimeJar.singleFile) })
    from({ zipTree(usb4javaNativeLibrariesJar.singleFile) }) {
        include 'org/usb4java/darwin-aarch64/**'
        include 'org/usb4java/darwin-legacy-aarch64/**'
        include 'org/usb4java/win32-aarch64/**'
    }
}

// JPMS bridge: the upstream java-lame jar name derives to the invalid automatic module name "java.lame.v3.98.4".
tasks.register('jpmsJavaLame', Jar) {
    archiveFileName = 'lame.jar'
    destinationDirectory = layout.buildDirectory.dir('jpms-libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(javaLameRuntimeJar.singleFile) })
}

