<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sdrtrunk-vce</title>
  <script>
    (() => {
      try {
        if (window.localStorage.getItem('sdrtrunk_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (error) {
        // Browser storage can be disabled; light remains the default.
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/app.css?v=43">
</head>
<body>
  <div class="app-shell">
    <div class="app-header">
      <header class="topbar" id="topbar">
        <a class="brand" href="/?view=dashboard">sdrtrunk-vce</a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a data-view="dashboard" href="/?view=dashboard" hidden>Dashboard</a>
          <a data-view="live" href="/?view=live" hidden>Live</a>
          <a data-view="systems" href="/?view=systems" hidden>Systems &amp; Sites</a>
          <a data-view="conventional" href="/?view=conventional" hidden>Conventional</a>
          <a data-view="aliases" href="/?view=aliases" hidden>Aliases</a>
          <a data-view="admin" href="/?view=admin&amp;tab=users" hidden>Admin</a>
          <a data-view="credits" href="/?view=credits" hidden>Credits</a>
        </nav>
        <div class="header-controls">
          <div id="server-status" class="server-status">Loading</div>
          <div id="auth-controls" class="auth-controls" aria-live="polite">
            <span id="auth-session-label" class="auth-session-label" hidden></span>
            <button type="button" id="auth-action" class="auth-action" disabled>Checking access</button>
          </div>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"
            aria-label="Use dark theme">Dark</button>
        </div>
      </header>
      <section class="playback-bar" id="playback-bar" aria-label="Web call playback">
        <button type="button" id="playback-play" class="playback-command" aria-pressed="false">Play</button>
        <button type="button" id="playback-skip" class="playback-command">Skip</button>
        <button type="button" id="playback-replay" class="playback-command">Replay</button>
        <button type="button" id="playback-hold" class="playback-command">Hold</button>
        <button type="button" id="playback-avoid" class="playback-command">Avoid</button>
        <button type="button" id="playback-clear" class="playback-command">Clear</button>
        <label class="playback-volume" title="Browser playback volume">
          <span class="playback-field">Vol</span>
          <input id="playback-volume" type="range" min="0" max="1" step="0.05" value="1"
            aria-label="Browser playback volume" aria-describedby="playback-volume-value">
          <output id="playback-volume-value" for="playback-volume">100%</output>
        </label>
        <div class="playback-now">
          <span class="playback-field">Now</span>
          <div id="playback-current" class="playback-current">
            <strong class="playback-current-primary">Idle</strong>
          </div>
        </div>
        <details class="playback-queue">
          <summary><span class="playback-field">Queued</span> <strong id="playback-queued">0</strong>
            <span class="playback-dropped" id="playback-dropped"></span></summary>
          <div id="playback-queue-list" class="playback-queue-list">No queued calls</div>
        </details>
        <label class="playback-limit"><span class="playback-field">Max</span>
          <input id="playback-max-queued" type="number" min="1" max="500" step="1" value="100">
        </label>
        <div id="playback-status" class="playback-status">Checking access</div>
        <div id="playback-progress" class="playback-progress" aria-hidden="true">
          <span id="playback-progress-glow" class="playback-progress-glow"></span>
        </div>
      </section>
    </div>
    <main id="content" class="content" aria-live="polite">
      <div class="loading">Loading</div>
    </main>
  </div>
  <script src="/assets/web-call-player.js?v=6"></script>
  <script src="/assets/app.js?v=58"></script>
</body>
</html>
