<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sdrtrunk-vce</title>
  <link rel="stylesheet" href="/assets/app.css?v=29">
</head>
<body>
  <div class="app-shell">
    <div class="app-header">
      <header class="topbar" id="topbar">
        <a class="brand" href="/?view=dashboard">sdrtrunk-vce</a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a data-view="dashboard" href="/?view=dashboard">Dashboard</a>
          <a data-view="live" href="/?view=live">Live</a>
          <a data-view="systems" href="/?view=systems">Systems &amp; Sites</a>
          <a data-view="conventional" href="/?view=conventional">Conventional</a>
          <a data-view="settings" href="/?view=settings&amp;section=hardware">Settings</a>
          <a data-view="credits" href="/?view=credits">Credits</a>
        </nav>
        <div id="server-status" class="server-status">Loading</div>
      </header>
      <section class="playback-bar" id="playback-bar" aria-label="Web call playback">
        <button type="button" id="playback-mute" class="playback-command">Unmute</button>
        <button type="button" id="playback-hold" class="playback-command">Hold</button>
        <button type="button" id="playback-avoid" class="playback-command">Avoid</button>
        <button type="button" id="playback-clear" class="playback-command">Clear</button>
        <button type="button" id="playback-skip" class="playback-command">Skip</button>
        <div class="playback-now">
          <span class="playback-field">Now</span>
          <div id="playback-current" class="playback-current">
            <strong class="playback-current-primary">Idle</strong>
          </div>
        </div>
        <details class="playback-queue">
          <summary><span class="playback-field">Queued</span> <strong id="playback-queued">0</strong>
            <span class="playback-dropped" id="playback-dropped"></span></summary>
          <div id="playback-queue-list" class="playback-queue-list">No queued calls</div>
        </details>
        <label class="playback-limit"><span class="playback-field">Max</span>
          <input id="playback-max-queued" type="number" min="1" max="500" step="1" value="100">
        </label>
        <div id="playback-status" class="playback-status">Connecting</div>
      </section>
    </div>
    <main id="content" class="content">
      <div class="loading">Loading</div>
    </main>
  </div>
  <script src="/assets/web-call-player.js?v=2"></script>
  <script src="/assets/wideband-signal.js?v=7"></script>
  <script src="/assets/live-activity.js?v=3"></script>
  <script src="/assets/selected-channel-diagnostics.js?v=2"></script>
  <script src="/assets/table-selection.js?v=1"></script>
  <script src="/assets/settings-hardware.js?v=4"></script>
  <script src="/assets/app.js?v=27"></script>
</body>
</html>
