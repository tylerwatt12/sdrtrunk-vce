<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
<title id="title">A retune must keep control and current calls</title><desc id="desc">The RTL-SDR window moves from center 771.2125 to 772.1125 MHz. Control at 771.0125 and an existing voice call at 771.5125 remain covered. New voice at 773.0125 becomes covered. A permitted retune may briefly disturb decoding.</desc>
