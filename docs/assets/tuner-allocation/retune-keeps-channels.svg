<text x="344.29" y="323.00" font-size="22" text-anchor="middle" font-weight="400" style="fill:#17324d">771.5125</text>
<path d="M601.43,219.00 L613.43,231.00 L601.43,243.00 L589.43,231.00 Z" fill="#ffffff" stroke="#bd5414" stroke-width="3"/>
