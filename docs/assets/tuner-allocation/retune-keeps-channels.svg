<text x="380.00" y="629.00" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">Control and current calls stay in range.</text>
<text x="380.00" y="660.00" font-size="23" text-anchor="middle" font-weight="400" style="fill:#17324d">The retune can still briefly disturb decoding.</text>
