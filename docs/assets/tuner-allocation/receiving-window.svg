<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc">
<title id="title">One tuner receives one frequency window</title><desc id="desc">At 2.4 MS/s an R820T-family RTL-SDR has 2.352 MHz usable bandwidth. Control at 771.0125 MHz and voice at 771.5125 and 772.0125 MHz fit at a center of 771.6125 MHz. Edge margins and a tiny center gap are unusable.</desc>
<rect width="760" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d} .number{font-variant-numeric:tabular-nums}</style>
