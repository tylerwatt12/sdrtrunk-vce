<line x1="363.00" y1="282.00" x2="379.00" y2="256.00" stroke="#536577" stroke-width="2"/>
<line x1="384.00" y1="282.00" x2="400.00" y2="256.00" stroke="#536577" stroke-width="2"/>
<text x="381.00" y="235.00" font-size="20" text-anchor="middle" font-weight="400" style="fill:#536577">80 MHz gap</text>
<text x="190.00" y="334.00" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">Control stays</text>
<text x="566.00" y="334.00" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">Voice cannot start</text>
<line x1="40.00" y1="361.00" x2="720.00" y2="361.00" stroke="#c8d4db" stroke-width="1.5"/>
<text x="40.00" y="407.00" font-size="26" text-anchor="start" font-weight="700" style="fill:#17324d">Two RTL-SDRs</text>
<text x="190.00" y="440.00" font-size="22" text-anchor="middle" font-weight="400" style="fill:#17324d">Tuner A</text>
<text x="566.00" y="440.00" font-size="22" text-anchor="middle" font-weight="400" style="fill:#17324d">Tuner B</text>
<rect x="62.00" y="458.00" width="256.00" height="54.00" rx="0" fill="#ccebf0"/>
<rect x="438.00" y="458.00" width="256.00" height="54.00" rx="0" fill="#ccebf0"/>
<circle cx="190.00" cy="485.00" r="9" fill="#2454a6" stroke="#2454a6" stroke-width="3"/>
<path d="M566.00,473.00 L578.00,485.00 L566.00,497.00 L554.00,485.00 Z" fill="#bd5414" stroke="#bd5414" stroke-width="3"/>
