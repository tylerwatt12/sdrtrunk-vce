<text x="190.00" y="550.00" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">Control continues</text>
<text x="566.00" y="550.00" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">Voice received</text>
<text x="380.00" y="601.00" font-size="22" text-anchor="middle" font-weight="400" style="fill:#17324d">An eligible idle second tuner can tune when the call arrives.</text>
<text x="380.00" y="631.00" font-size="20" text-anchor="middle" font-weight="400" style="fill:#536577">Schematic: the frequency gap is compressed.</text>
