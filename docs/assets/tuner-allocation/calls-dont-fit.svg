<title id="title">Enough tuners but no room for this call</title><desc id="desc">Current voice calls use tuner A at 851.0125 and 853.0125 MHz, and tuner B at 852.0125 and 854.0125 MHz. A new 855.0125 MHz call cannot fit either group. A different grouping could receive all five with the same hardware, but current VCE does not move ongoing calls between tuners to create it.</desc>
