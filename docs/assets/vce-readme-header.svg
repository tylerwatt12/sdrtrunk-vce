<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="header-title header-description">
  <title id="header-title">VCE</title>
  <desc id="header-description">The VCE wordmark surrounded by wireframe cubes, a sphere, and pyramids on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081923"/>
      <stop offset=".55" stop-color="#07111d"/>
      <stop offset="1" stop-color="#0b2430"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d6c5" stop-opacity=".16"/>
      <stop offset=".35" stop-color="#55d6c5" stop-opacity=".025"/>
      <stop offset=".65" stop-color="#55d6c5" stop-opacity=".025"/>
      <stop offset="1" stop-color="#55d6c5" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="440" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
