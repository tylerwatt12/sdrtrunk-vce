name: Alpha CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/0.6.2-alpha
  pull_request:
    branches:
      - release/0.6.2-alpha

permissions:
  contents: read

jobs:
  build:
    name: Alpha build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-command: ./gradlew
          - os: macos-latest
            gradle-command: ./gradlew
          - os: windows-latest
            gradle-command: .\gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Alpha source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: liberica
          java-package: jdk+fx

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test Alpha
        run: >-
          ${{ matrix.gradle-command }} --no-configuration-cache clean build
          -PprojectVersion=alpha-dev -PupdateTrack=none -PupdateBuild=0

  gate:
    name: Alpha CI gate
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every Alpha platform build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = "success"
