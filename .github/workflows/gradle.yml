# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Main CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Main build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle_command: ./gradlew
          - os: macos-latest
            gradle_command: ./gradlew
          - os: windows-latest
            gradle_command: .\gradlew.bat
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: >-
          ${{ matrix.gradle_command }} --no-configuration-cache clean build
          -PprojectVersion=local-dev -PupdateTrack=none -PupdateBuild=0

  gate:
    name: Main CI gate
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every main platform build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = "success"
