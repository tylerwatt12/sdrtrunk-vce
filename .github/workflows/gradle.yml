name: Main CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      radio_system_catalog_artifact:
        description: Exact prepared network-name snapshot to test with the candidate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Application checks (${{ matrix.os }}, ${{ matrix.test_group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, test_group: core}
          - {os: ubuntu-latest, test_group: migrations}
          - {os: ubuntu-latest, test_group: activity}
          - {os: ubuntu-latest, test_group: web}
          - {os: ubuntu-latest, test_group: http}
          - {os: windows-latest, test_group: platform-filesystem}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python for timing reports
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download the prepared radio-system catalog
        if: ${{ inputs.radio_system_catalog_artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.radio_system_catalog_artifact }}
          path: ${{ runner.temp }}/radio-system-catalog

      - name: Run full check
        id: full-check
        shell: bash
        env:
          RADIO_SYSTEM_CATALOG_FILE: ${{ inputs.radio_system_catalog_artifact != '' && format('{0}/radio-system-catalog/dsdplus.networks', runner.temp) || 'src/test/resources/radio-systems/dsdplus-fixture.networks' }}
        run: >-
          ./gradlew --no-configuration-cache clean check
          -PprojectVersion=local-dev -PupdateTrack=none -PupdateBuild=0
          -PtestGroup=${{ matrix.test_group }}
          -PradioSystemCatalogFile="$RADIO_SYSTEM_CATALOG_FILE"
      - name: Record application test timings
        if: always()
        shell: bash
        env:
          CHECK_RESULT: ${{ steps.full-check.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          suites = []
          for path in sorted(pathlib.Path('build/test-results/test').glob('TEST-*.xml')):
              suite = ET.parse(path).getroot()
              suites.append({key: suite.attrib.get(key, '0') for key in
                             ('name', 'tests', 'failures', 'errors', 'skipped', 'time')})
          if os.environ['CHECK_RESULT'] == 'success' and not suites:
              raise SystemExit('A successful application check must produce test results')
          output = pathlib.Path('build/test-timings.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(suites, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Save application test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-test-timings-${{ matrix.os }}-${{ matrix.test_group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-timings.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Gradle failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-ci-gradle-failure-${{ matrix.os }}-${{ matrix.test_group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/test
            build/reports/tests/test
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: Web and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python for release contracts
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check browser behavior contracts
        run: node src/test/js/stats-web/run-contracts.js
      - name: Check Nightly preparation and publication guards
        run: node src/test/js/release/nightly-workflow.test.js .github/workflows/nightly.yml
      - name: Check packaged database smoke contracts
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      - name: Check radio-system catalog extraction
        run: python -m unittest discover -s tools/build -p 'test_*.py'

  visual:
    name: Web design-system visual contract (${{ matrix.shard }}/3)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install visual-test dependencies
        run: npm ci
      - name: Install the pinned Chromium browser
        run: npx playwright install chromium
      - name: Compare design-system screenshots
        run: npm run test:web-visual -- --workers=2 --shard=${{ matrix.shard }}/3
      - name: Save browser timings and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-design-system-results-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/playwright-report/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-design-system-visual-differences-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/playwright-results
            build/playwright-report
          if-no-files-found: ignore

  gate:
    name: Main CI gate
    if: ${{ always() }}
    needs:
      - check
      - visual
      - contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
        run: test "$CHECK_RESULT" = "success" && test "$VISUAL_RESULT" = "success" && test "$CONTRACT_RESULT" = "success"
