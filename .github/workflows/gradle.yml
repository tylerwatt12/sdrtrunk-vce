name: Main CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Full check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python for release contracts
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check Nightly preparation and publication guards
        run: node src/test/js/release/nightly-workflow.test.js .github/workflows/nightly.yml

      - name: Run full check
        shell: bash
        run: >-
          ./gradlew --no-configuration-cache clean check
          -PprojectVersion=local-dev -PupdateTrack=none -PupdateBuild=0

  visual:
    name: Web design-system visual contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install visual-test dependencies
        run: npm ci
      - name: Install the pinned Chromium browser
        run: npx playwright install chromium
      - name: Compare design-system screenshots
        run: npm run test:web-visual -- --workers=2
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-design-system-visual-differences
          path: |
            build/playwright-results
            build/playwright-report
          if-no-files-found: ignore

  gate:
    name: Main CI gate
    if: ${{ always() }}
    needs:
      - check
      - visual
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: test "$CHECK_RESULT" = "success" && test "$VISUAL_RESULT" = "success"
