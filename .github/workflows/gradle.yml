name: Main CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Full check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full check
        shell: bash
        run: >-
          ./gradlew --no-configuration-cache clean check
          -PprojectVersion=local-dev -PupdateTrack=none -PupdateBuild=0

  gate:
    name: Main CI gate
    if: ${{ always() }}
    needs:
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = "success"
