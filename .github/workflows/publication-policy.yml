name: Publication policy

on:
  push:
  pull_request:
  release:
    types: [published, edited, prereleased, released]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check published files
        run: ./tools/verify-publication-policy.sh --tree "$GITHUB_SHA"

      - name: Check commit metadata and document history
        env:
          BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ./tools/verify-publication-policy.sh --range "$PR_BASE_SHA..$GITHUB_SHA"
          elif [[ -n "$BASE_SHA" ]] && git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            ./tools/verify-publication-policy.sh --range "$BASE_SHA..$GITHUB_SHA"
          else
            printf '%s\n' "$GITHUB_SHA" | ./tools/verify-publication-policy.sh --commits
          fi

      - name: Check pull request metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | ./tools/verify-publication-policy.sh --stdin "pull request metadata"

      - name: Check tag metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: git for-each-ref --format='%(contents)' "$GITHUB_REF" | ./tools/verify-publication-policy.sh --stdin "tag metadata"

      - name: Check release metadata
        if: github.event_name == 'release'
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: printf '%s\n%s\n%s\n' "$RELEASE_NAME" "$RELEASE_BODY" "$RELEASE_TAG" | ./tools/verify-publication-policy.sh --stdin "release metadata"
