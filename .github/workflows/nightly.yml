# Package and publish the already-tested main branch.
name: Nightly Release

on:
  push:
    branches: [ main ]

concurrency:
  group: nightly-${{ github.ref }}
  # Publishing replaces release assets before moving the nightly tag. Let an in-flight publication finish so a
  # newer push cannot cancel it between those operations; the newer run waits and publishes its own complete set.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-and-publish:
    name: Package and publish nightly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_BUILD: ${{ github.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: liberica
          java-package: jdk+fx

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package releases
        run: >-
          ./gradlew --no-configuration-cache clean runtimeZipAll
          -PprojectVersion=nightly -PupdateTrack=nightly -PupdateBuild=${UPDATE_BUILD}

      - name: Refuse an out-of-order nightly publication
        shell: bash
        run: |
          remote_manifest="$(mktemp)"
          if curl --fail --silent --show-error --location \
            https://github.com/tylerwatt12/sdrtrunk-vce/releases/download/nightly/update.properties \
            --output "${remote_manifest}"
          then
            remote_track="$(sed -n 's/^track=//p' "${remote_manifest}")"
            remote_build="$(sed -n 's/^build=//p' "${remote_manifest}")"
            if [[ "${remote_track}" == "nightly" && "${remote_build}" =~ ^[0-9]+$ ]] &&
              (( remote_build >= UPDATE_BUILD ))
            then
              echo "Refusing stale nightly build ${UPDATE_BUILD}; published build is ${remote_build}."
              exit 1
            fi
          fi

      - name: Create build information and updater manifest
        shell: bash
        run: |
          nightly_version="nightly-${UPDATE_BUILD}-${GITHUB_SHA:0:7}"
          printf 'channel: nightly\nref: %s\ncommit: %s\nupdate-build: %s\nbuilt-at: %s\n' \
            "$GITHUB_REF" \
            "$GITHUB_SHA" \
            "$UPDATE_BUILD" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > build/image/build_info.txt
          printf 'format=2\ntrack=nightly\nbuild=%s\nversion=%s\nurl=%s\n' \
            "$UPDATE_BUILD" \
            "$nightly_version" \
            'https://github.com/tylerwatt12/sdrtrunk-vce/releases/tag/nightly' \
            > build/image/update.properties

      - name: Add build artifacts to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: SDRTrunk VCE Nightly
          prerelease: true
          body: |
            Rolling pre-release build from current `main`.

            Nightly builds contain the newest completed features and fixes and may change frequently. Back up the
            complete portable data folder before upgrading.

            See the [README](https://github.com/tylerwatt12/sdrtrunk-vce#readme),
            [release-channel guide](https://github.com/tylerwatt12/sdrtrunk-vce/blob/main/docs/release-channels.md), and
            [database migration guide](https://github.com/tylerwatt12/sdrtrunk-vce/blob/main/docs/database-migration.md)
            for current behavior and upgrade guidance.
          files: |
            build/image/*.zip
            build/image/build_info.txt
            build/image/update.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point nightly tag to this build
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
