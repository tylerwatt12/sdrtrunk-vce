# Create nightly release for Linux, Mac and Windows using the Linux runner.
name: Nightly Release

on:
  push:
    branches: [ main ]
# Don't run nightly build for pull requests - uncomment to test changes to this action within scope of the PR review
#  pull_request:
#    branches: [ main ]

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Build Linux and Mac releases with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: --no-configuration-cache runtimeZipOthers -PprojectVersion=nightly

      - name: Build Windows release with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: --no-configuration-cache runtimeZipWindows -PprojectVersion=nightly

      - name: Create Build Info file
        run: |
          echo -e "ref: $GITHUB_REF \ncommit: $GITHUB_SHA\nbuild: $(date +"%Y-%m-%dT%H:%M:%SZ")" > build/image/build_info.txt

      - name: Add build artifacts to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            build/image/*.zip
            build/image/build_info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point nightly tag to this build
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
