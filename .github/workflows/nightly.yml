# Verify every supported host before creating the cross-platform nightly packages on Linux.
name: Nightly Release

on:
  push:
    branches: [ main ]

concurrency:
  group: nightly-${{ github.ref }}
  # Publishing replaces release assets before moving the nightly tag. Let an in-flight publication finish so a
  # newer push cannot cancel it between those operations; the newer run waits and publishes its own complete set.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean-build:
    name: Clean Java 25 build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradle_command: ./gradlew
          - name: macOS
            os: macos-latest
            gradle_command: ./gradlew
          - name: Windows
            os: windows-latest
            gradle_command: .\gradlew.bat
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: liberica
          java-package: jdk+fx

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run clean build
        run: ${{ matrix.gradle_command }} --no-configuration-cache clean build -PprojectVersion=nightly

  package-and-publish:
    name: Package and publish nightly
    needs: clean-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: liberica
          java-package: jdk+fx

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package Linux and macOS releases
        run: ./gradlew --no-configuration-cache runtimeZipOthers -PprojectVersion=nightly

      - name: Package Windows releases
        run: ./gradlew --no-configuration-cache runtimeZipWindows -PprojectVersion=nightly

      - name: Create build information
        run: |
          printf 'ref: %s\ncommit: %s\nbuild: %s\n' \
            "$GITHUB_REF" \
            "$GITHUB_SHA" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > build/image/build_info.txt

      - name: Add build artifacts to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            build/image/*.zip
            build/image/build_info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point nightly tag to this build
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
